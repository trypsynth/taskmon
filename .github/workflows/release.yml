name: Release Taskmon
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes to master would otherwise race to force-move the nightly
# tag, and the older run could finish last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows
          - arch: arm64
            target: aarch64-windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Pandoc
        run: choco install pandoc

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "0.0.0-nightly.$shortSha"
          }
          echo "TASKMON_VERSION=$version" >> $env:GITHUB_ENV

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} --summary all

      - name: Prepare Package
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $dist = "dist-$arch"
          New-Item -ItemType Directory -Path $dist

          # Copy executable
          Copy-Item zig-out/bin/taskmon.exe -Destination "$dist/taskmon.exe"

          # Copy documentation (HTML if generated, otherwise fallback to MD)
          if (Test-Path "zig-out/bin/readme.html") {
            Copy-Item zig-out/bin/readme.html -Destination "$dist/readme.html"
          } else {
            Copy-Item doc/readme.md -Destination "$dist/readme.md"
          }

          # Create ZIP
          Compress-Archive -Path "$dist/*" -DestinationPath "taskmon-$arch.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: taskmon-${{ matrix.arch }}
          path: taskmon-*.zip
          if-no-files-found: error

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: taskmon-installer-${{ matrix.arch }}
          path: zig-out/bin/taskmon-setup-*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Move nightly tag
        if: github.ref_type == 'branch'
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: List artifacts
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && format('Taskmon Release {0}', github.ref_name) || 'Taskmon Nightly Build' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
          files: |
            ./artifacts/taskmon-x64/taskmon-x64.zip
            ./artifacts/taskmon-arm64/taskmon-arm64.zip
            ./artifacts/taskmon-installer-x64/taskmon-setup-x64.exe
            ./artifacts/taskmon-installer-arm64/taskmon-setup-arm64.exe

